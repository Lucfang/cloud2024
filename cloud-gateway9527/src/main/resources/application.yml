server:
  port: 9527

spring:
  application:
    name: cloud-gateway
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
        service-name: ${spring.application.name}
    gateway:
      routes:
        - id: pay_routh1 #路由的id(类似mysql主键ID)，没有固定规则但要求唯一，建议配合服务名
          #uri: http://localhost:8001 #匹配后提供服务的路由地址
          uri: lb://cloud-payment-service #匹配后提供服务的路由地址
          predicates:
            - Path=/pay/gateway/get/** #断言，路径相匹配的进行路由
            - After=2026-08-10T15:51:19.621163600+08:00[Asia/Shanghai]
            #- Cookie=username,lcf
            #- Header=X-Request-Id, \d+ #请求头要有X-Request-Id属性并且值为整数的正则表达式
            #- Host=**.somehost.org,**.anotherhost.org
            #- Query=username,\d+
            #- RemoteAddr=192.168.169.1/24
            #- Method=GET,POST
#            - name: My
#              args:
#                userType: diamond
            - My=diamond

        - id: pay_routh2
          #uri: http://localhost:8001
          uri: lb://cloud-payment-service
          predicates:
            - Path=/pay/gateway/info/**

        - id: pay_routh3
          uri: lb://cloud-payment-service
          predicates:
            #- Path=/XYZ/abc/{segment}
            #- Path=/gateway/filter/**
            - Path=/pay/gateway/filter/**
          filters:
            - My=lcf
#            - RedirectTo=302, https://www.baidu.com
            #- SetPath=/pay/gateway/{segment}
            #- PrefixPath=/pay
#            - AddRequestHeader=X-Request-lcf1, lcf1 #请求头kv，若一头含有多参则重写一行设置
#            - AddRequestHeader=X-Request-lcf2, lcf2
#            - RemoveRequestHeader=sec-fetch-site #删除请求头sec-fetch-site
#            - SetRequestHeader=sec-fetch-mode, Blue-updatelcf #将请求头sec-fetch-mode对应的值修改为Blue-updatelcf
#            - AddRequestParameter=customerId, 789 #新增请求参数parameter；k,v
#            - RemoveRequestParameter=customerName #删除url请求参数customerName，你传递过来也是null
#            - AddResponseHeader=X-Response-Red, Blue
#            - RemoveResponseHeader=Content-Type
#            - SetResponseHeader=Date, 2099-11-11