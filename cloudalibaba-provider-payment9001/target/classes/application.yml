server:
  port: 9001
spring:
  application:
    name: nacos-payment-provider
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 #配置nacos地址
    sentinel:
      transport:
        dashboard: localhost:8080 #配置sentinel dashboard控制台服务地址
        port: 8719  #默认8917端口，假如被占用会自动从8971开始依次+1扫描，直到找到未被占用的端口
