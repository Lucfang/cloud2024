server:
  port: 8007

# ====== applicationName + druid-mysql8 driver ================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.169.130:3308/clouddb2024?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  profiles:
    active: dev

# ============mybatis ====================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lcf.cloud.entities
  configuration:
    map-underscore-to-camel-case: true

#============= zipkin ====================
management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 #采样率默认为0.1(0.1就是10次只能有一次被记录下来)，值越大收集越及时